name: Deploy Chipitiempo to VPS
on:
  push:
    branches:
      - prod
jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Add host to known_hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy to VPS
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            set -e  # Exit on error
            
            REPO_ROOT="/home/jjmontalban/web/chipitiempo"
            DEPLOY_DIR="${REPO_ROOT}/public_html"
            
            echo "=========================================="
            echo "[$(date)] 🚀 Iniciando despliegue ChipiTiempo"
            echo "=========================================="
            
            # Verificar estructura de directorios
            echo "[$(date)] 📂 Estructura de directorios:"
            ls -la "$REPO_ROOT" | head -20
            
            # Ir al directorio de despliegue
            cd "$DEPLOY_DIR"
            echo "[$(date)] 📍 Directorio actual: $(pwd)"
            
            # Descargar cambios
            echo ""
            echo "[$(date)] 📥 Descargando cambios del repositorio..."
            git fetch origin prod
            git reset --hard origin/prod
            
            # Generar HTML (pasando ruta absoluta para asegurar que se guarde en public_html)
            echo ""
            echo "[$(date)] 🔧 Generando index.html..."
            php8.3 generate.php "${DEPLOY_DIR}/index.html" 2>&1
            
            # Verificar que el archivo se generó correctamente
            echo ""
            echo "[$(date)] ✅ Verificando archivo generado..."
            
            if [ -f "${DEPLOY_DIR}/index.html" ] && [ -s "${DEPLOY_DIR}/index.html" ]; then
              SIZE=$(wc -c < "${DEPLOY_DIR}/index.html")
              MODIFIED=$(date -r "${DEPLOY_DIR}/index.html" "+%Y-%m-%d %H:%M:%S")
              echo "[$(date)] ✓ index.html generado correctamente"
              echo "[$(date)]   📊 Tamaño: $SIZE bytes"
              echo "[$(date)]   🕐 Hora: $MODIFIED"
              echo "[$(date)]   📍 Ubicación: ${DEPLOY_DIR}/index.html"
            else
              echo "[$(date)] ✗ ERROR: index.html no existe o está vacío en ${DEPLOY_DIR}/"
              ls -la "${DEPLOY_DIR}/" 2>&1 || true
              exit 1
            fi
            
            # Establecer permisos (HestiaCP)
            echo ""
            echo "[$(date)] 🔐 Estableciendo permisos..."
            chown -R jjmontalban:jjmontalban "${DEPLOY_DIR}"
            chmod 644 "${DEPLOY_DIR}/index.html"
            chmod 755 "${DEPLOY_DIR}"
            
            # Verificar permisos
            ls -lh "${DEPLOY_DIR}/index.html"
            
            # Limpiar archivos temporales si existen
            echo ""
            echo "[$(date)] 🧹 Limpiando archivos temporales..."
            rm -f "${DEPLOY_DIR}/generate.log"
            
            # Información final
            echo ""
            echo "[$(date)] 📊 Verificación final:"
            echo "[$(date)]   Content-Length:"
            wc -c "${DEPLOY_DIR}/index.html" 2>&1 || true
            
            echo ""
            echo "=========================================="
            echo "[$(date)] ✨ Despliegue completado exitosamente"
            echo "=========================================="
          ENDSSH
